global:
  scrape_interval: 5s

scrape_configs:
  # Scrape the URL Shortener
  - job_name: 'url-shortener'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['url-shortener-app:8080']

  # Scrape the Rate Limiter
  - job_name: 'rate-limiter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rate-limiter-app:8081']