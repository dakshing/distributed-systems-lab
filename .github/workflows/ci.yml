name: Distributed Systems CI

on:
  push:
    branches: [ "main", "feature-url-shortener-design" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - uses: actions/checkout@v3

      # 2. Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build & Install 'dsl-common'
      - name: Build Common Module
        run: |
          cd java/dsl-common
          mvn clean install -DskipTests

      # 4. Test 'dsl-common'
      - name: Test Common Module
        run: |
          cd java/dsl-common
          mvn test

      # 5. Build & Test 'url-shortener'
      - name: Build & Test URL Shortener
        run: |
          cd java/url-shortener
          mvn clean package